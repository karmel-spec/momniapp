<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Illustrated portrait of Whitney J., the example Momni host">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5F0FE"/><stop offset="1" stop-color="#DDEFEA"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A66B0"/><stop offset="1" stop-color="#6D58A4"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5A3A2E"/><stop offset="1" stop-color="#3E2620"/></linearGradient>
    <radialGradient id="skin" cx=".45" cy=".35" r=".8"><stop offset="0" stop-color="#F6D3B8"/><stop offset="1" stop-color="#E9B995"/></radialGradient>
    <clipPath id="c"><rect width="200" height="200"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <circle cx="150" cy="40" r="70" fill="#92E2C1" opacity=".28"/>
    <circle cx="30" cy="180" r="46" fill="#6D58A4" opacity=".10"/>
    <!-- hair back -->
    <path d="M52 96c0-34 20-58 48-58s48 24 48 58v54c0 10-8 18-18 18H70c-10 0-18-8-18-18z" fill="url(#hair)"/>
    <!-- shoulders / top -->
    <path d="M22 212c4-40 30-62 78-62s74 22 78 62z" fill="url(#top)"/>
    <path d="M78 152c4 12 12 18 22 18s18-6 22-18l-6-6H84z" fill="#5C4894"/>
    <!-- neck -->
    <path d="M86 118h28v34c0 8-6 12-14 12s-14-4-14-12z" fill="#E4B08B"/>
    <!-- face -->
    <ellipse cx="100" cy="98" rx="33" ry="38" fill="url(#skin)"/>
    <!-- ears -->
    <ellipse cx="66" cy="102" rx="5" ry="7" fill="#E9B995"/><ellipse cx="134" cy="102" rx="5" ry="7" fill="#E9B995"/>
    <circle cx="66" cy="112" r="2.4" fill="#92E2C1"/><circle cx="134" cy="112" r="2.4" fill="#92E2C1"/>
    <!-- bangs / hair front -->
    <path d="M67 92c-2-26 14-46 33-46s35 18 33 46c-6-14-14-22-24-24-6 8-18 12-30 10-6 4-10 9-12 14z" fill="url(#hair)"/>
    <path d="M118 70c8 6 12 16 13 26" stroke="#7A5647" stroke-width="2" fill="none" opacity=".5" stroke-linecap="round"/>
    <!-- brows -->
    <path d="M80 86c5-4 11-4 16-1" stroke="#4A3028" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M104 85c5-3 11-3 16 1" stroke="#4A3028" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <!-- smiling eyes -->
    <path d="M81 98c4-5 10-5 14 0" stroke="#2B2233" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M105 98c4-5 10-5 14 0" stroke="#2B2233" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <!-- nose -->
    <path d="M100 100c-2 6-3 9 1 11" stroke="#D9A07C" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- blush -->
    <ellipse cx="80" cy="110" rx="7" ry="4" fill="#F0A5A0" opacity=".45"/><ellipse cx="120" cy="110" rx="7" ry="4" fill="#F0A5A0" opacity=".45"/>
    <!-- smile -->
    <path d="M89 119c6 7 16 7 22 0" stroke="#B9635A" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M92 120c5 4 11 4 16 0" fill="#fff" opacity=".9"/>
    <!-- little elephant pin on the top -->
    <circle cx="128" cy="176" r="7" fill="#F5F0FE"/><text x="128" y="180" text-anchor="middle" font-size="9">🐘</text>
  </g>
</svg>
