<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Momni — Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Albert+Sans:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#6D58A4; --purple-deep:#4A3880; --teal:#0D878F; --teal-deep:#0A6B72;
  --algae:#92E2C1; --lavender:#F5F0FE; --teal-soft:#E1F7F2; --clay:#D9C0A3;
  --ink:#2B2233; --muted:#6B6477; --white:#FFFFFF; --line:#EEE9F9;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Albert Sans',sans-serif;color:var(--ink);background:var(--lavender);line-height:1.55;min-height:100vh;display:flex;justify-content:center}
h1,h2,h3{font-family:'Montserrat',sans-serif}
a{text-decoration:none;color:inherit}
.script{font-family:'Caveat',cursive}
.app{width:100%;max-width:480px;min-height:100vh;background:var(--white);box-shadow:0 0 40px rgba(109,88,164,0.12);display:flex;flex-direction:column;padding-bottom:150px}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.topbar .back{font-size:22px;color:var(--purple);font-weight:700}
.topbar img{height:30px;display:block}
main{padding:18px 20px 8px}
.head{text-align:center;margin-bottom:8px}
.avatar{width:88px;height:88px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:800;font-size:34px;margin:4px auto 12px}
.avatar.photo{background-size:cover;background-position:center;color:transparent}
.gallery{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:2px 0 8px;margin:0 -20px;padding-left:20px;padding-right:20px;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery img{flex:0 0 78%;max-width:300px;aspect-ratio:4/3;object-fit:cover;border-radius:14px;scroll-snap-align:start;background:var(--lavender)}
.head h1{font-size:23px;font-weight:800;letter-spacing:-0.02em}
.loc{font-size:14px;color:var(--muted);margin-top:3px}
.pills{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:12px}
.pill{font-size:12px;font-weight:600;border-radius:100px;padding:5px 12px}
.pill.badge{background:#FCFBFE;border:1.5px solid var(--line)}
.pill.now{background:#FFF3D6;color:#8A5A00;border:1.5px solid #F2D98B}
.rating{font-size:15px;font-weight:700;margin-top:12px}
.rating .star{color:#BA7517}
.rating span{color:var(--muted);font-weight:500;font-size:14px}
.sec{border-top:1px solid var(--line);padding:16px 0 4px;margin-top:8px}
.sec h2{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.sec p{font-size:15px}
.ct{display:flex;flex-wrap:wrap;gap:8px}

.rate{font-size:14px;color:var(--teal-deep);font-weight:600;margin-top:10px}
.avail{display:flex;flex-direction:column;gap:4px}
.avail .row{display:flex;gap:8px;font-size:14px}
.avail .d{font-weight:700;width:42px;flex-shrink:0}
.shared a{color:var(--teal-deep);font-weight:600}
.fine{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.review{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px}
.review .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.review .who{font-size:14px;font-weight:700}
.review .rstars{color:#BA7517;font-size:13px}
.review .body{font-size:14px;line-height:1.55}
.review .date{font-size:11px;color:var(--muted);margin-top:6px}
.cta-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);padding:14px 20px;z-index:50}
.cta-bar .req{display:block;text-align:center;background:var(--algae);color:#0B4A36;border-radius:100px;padding:14px;font-size:16px;font-weight:700}
.cta-bar .note{font-size:11px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.5}
.state{padding:48px 24px;text-align:center;color:var(--muted)}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctile{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:8px;row-gap:3px;border-radius:14px;padding:12px 13px;border:1.5px solid transparent}
.ctile .ctt{grid-column:1;grid-row:1;font-size:14px;font-weight:800;font-family:'Montserrat',sans-serif}
.ctile .cti{grid-column:2;grid-row:1;font-size:20px;line-height:1}
.ctile .cth{grid-column:1/-1;grid-row:2;font-size:12px;color:var(--muted);line-height:1.35}
.ctile.available-now{background:var(--teal-soft)}.ctile.available-now .ctt{color:var(--teal-deep)}
.ctile.night-out{background:var(--lavender)}.ctile.night-out .ctt{color:var(--purple-deep)}
.ctile.recurring{background:#FBF6EE;border-color:#EFE3D0}.ctile.recurring .ctt{color:#8A6B3F}
.ctile.overnight{background:#EEF1FB}.ctile.overnight .ctt{color:#3B4A8A}
.pay{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:10px}
.paylabel{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.paychip{display:inline-block;font-size:12.5px;padding:5px 11px;border-radius:8px;line-height:1.2}
.paychip.logo{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);padding:5px 10px}
.paychip.logo img{height:16px;width:auto;display:block}
.paychip.logo b{font-size:12.5px;font-weight:800;color:#00D632}
.littles{display:flex;flex-wrap:wrap;gap:14px 18px;margin:4px 0 2px}
.little{display:flex;flex-direction:column;align-items:center;width:72px;text-align:center}
.lface{width:60px;height:60px;border-radius:50%;display:block;overflow:hidden;box-shadow:0 2px 10px rgba(109,88,164,.12)}
.lface svg{width:100%;height:100%;display:block}
.lface.photo{background:center/cover no-repeat}
.lname{font-size:13.5px;font-weight:700;margin-top:6px;line-height:1.2}
.lage{font-size:12px;color:var(--muted)}
.home-photo{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:14px;display:block;margin-bottom:10px;background:var(--lavender)}
.cover{position:relative;margin:0 -20px 0;aspect-ratio:16/10;background:var(--lavender)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .avatar{position:absolute;left:20px;bottom:-34px;margin:0;border:4px solid #fff;box-shadow:0 6px 18px rgba(43,34,51,.18)}
.head.has-cover{padding-top:44px;text-align:left}
.head.has-cover h1{text-align:left}
.head.has-cover .pills,.head.has-cover .rating,.head.has-cover .loc{justify-content:flex-start;text-align:left}
.example-banner{background:var(--lavender);border:1.5px solid #DDD3F3;border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.5;color:var(--purple-deep);margin:0 0 14px}
.example-banner b{font-weight:800}
.intro-video{width:100%;aspect-ratio:9/12;max-height:420px;background:#111;border-radius:16px;overflow:hidden;display:block;object-fit:cover}
.review .top{display:flex;align-items:center;gap:10px}
.ravatar{width:34px;height:34px;border-radius:50%;background:var(--purple) center/cover no-repeat;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:800;font-size:13px;flex-shrink:0}
.review .who small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.review .rstars{margin-left:auto}
</style>
<script src="littles.js"></script>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="search.html" aria-label="Back to search">&#8592;</a>
    <img src="assets/momni-logo-color-horizontal.png" alt="Momni">
  </div>
  <main id="main"><p class="state">Loading this Momni…</p></main>
  <div class="cta-bar" id="cta" style="display:none">
    <a class="req" id="req-btn" href="#">Request a Link</a>
    <p class="note">You'll meet first. Care is arranged mom to mom — Momni never touches payment.</p>
  </div>
</div>
<script>
(function(){
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  var CT = {'available-now':'Available Now','night-out':'Night Out','recurring':'Recurring','overnight':'Overnight'};
  var CTM = {'available-now':{e:'💡',t:'Available Now',h:'Care today — sometimes within the hour'},'night-out':{e:'🌙',t:'Night Out',h:'An evening out, kiddos in good hands'},'recurring':{e:'🔁',t:'Recurring',h:'The same mornings or afternoons every week'},'overnight':{e:'🛏️',t:'Overnight',h:'One night to a whole stretch'}};
  var BLK = {am:'Mornings',pm:'Afternoons',eve:'Evenings',overnight:'Overnight'};
  var DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var stars = function(n){ n = Math.round(n||0); return '★★★★★'.slice(0,n) + '☆☆☆☆☆'.slice(0,5-n); };

  var id = new URLSearchParams(location.search).get('id');
  if (!id) { document.getElementById('main').innerHTML = '<p class="state">No Momni selected. <a href="search.html" style="color:var(--teal-deep);font-weight:600">Back to search</a></p>'; return; }

  fetch('/api/hosts/' + encodeURIComponent(id)).then(function(r){ return r.ok ? r.json() : null; })
    .then(function(h){
      if (!h) { document.getElementById('main').innerHTML = '<p class="state">We couldn’t find that Momni. <a href="search.html" style="color:var(--teal-deep);font-weight:600">Back to search</a></p>'; return; }
      render(h);
    }).catch(function(){
      document.getElementById('main').innerHTML = '<p class="state">Something went wrong — <a href="search.html" style="color:var(--teal-deep);font-weight:600">back to search</a>.</p>';
    });

  function render(h){
    var first = (h.name || 'A Momni').split(' ')[0];
    var revs = Array.isArray(h.reviews) ? h.reviews : [];
    var avg = revs.length ? revs.reduce(function(s,r){ return s + (r.rating||0); }, 0) / revs.length : null;
    var loc = [h.neighborhood, h.city].filter(Boolean).join(' · ');
    var avatar = h.photo_url ? '<div class="avatar photo" style="background-image:url(\'' + esc(h.photo_url) + '\')"></div>'
                             : '<div class="avatar">' + esc((first[0]||'M').toUpperCase()) + '</div>';
    var html = (h.family_photo ? '<div class="cover"><img src="' + esc(h.family_photo) + '" alt="' + esc(first) + '’s family">' + avatar + '</div>' : '') +
      '<div class="head' + (h.family_photo ? ' has-cover' : '') + '">' + (h.family_photo ? '' : avatar) +
      '<h1>' + esc(h.name || 'A Momni') + '</h1>' +
      (loc ? '<div class="loc">📍 ' + esc(loc) + ' <span style="font-size:12px">· neighborhood level</span></div>' : '') +
      '<div class="pills">' +
        (h.available_now ? '<span class="pill now">💡 Available now</span>' : '') +
        (h.badges||[]).map(function(b){ return '<span class="pill badge" title="'+esc(b.note||'')+'">'+esc(b.emoji||'')+' '+esc(b.label||'')+'</span>'; }).join('') +
      '</div>' +
      (avg != null ? '<div class="rating"><span class="star">'+stars(avg)+'</span> '+avg.toFixed(1)+' <span>from '+revs.length+' Momni review'+(revs.length===1?'':'s')+'</span></div>' : '<div class="rating"><span>No reviews yet — be the first to connect.</span></div>') +
    '</div>';

    if (h.is_example) html += '<div class="example-banner"><b>✨ Example profile.</b> This is what a complete Momni host profile looks like — every section filled in, a hello video, shared items, and reviews. Use it as your model; the people here aren’t real.</div>';
    if (h.intro_video) html += sec('Meet ' + first,
      '<video class="intro-video" controls playsinline preload="metadata"' + (h.photo_url ? ' poster="' + esc(h.photo_url) + '"' : '') + ' src="' + esc(h.intro_video) + '"></video>' +
      '<p class="fine" style="margin-top:8px">A one-minute hello from ' + esc(first) + ' — who she is, her home, and how a day with her littles goes.</p>');
    if (h.bio) html += sec('About', '<p>'+esc(h.bio)+'</p>');
    var littles = Array.isArray(h.littles) ? h.littles : [];
    if (littles.length || h.kids_note) html += sec(first + '’s littles',
      (littles.length ? '<div class="littles">' + littles.map(function(l){
        var face = l.photo_url ? '<span class="lface photo" style="background-image:url(\'' + esc(l.photo_url) + '\')"></span>'
                               : '<span class="lface">' + MomniLittles.icon(l.sex) + '</span>';
        return '<div class="little">' + face + '<span class="lname">' + esc(l.name) + '</span>' + (l.age ? '<span class="lage">' + esc(l.age) + '</span>' : '') + '</div>';
      }).join('') + '</div>' : '') +
      (h.kids_note ? '<p' + (littles.length ? ' style="margin-top:10px"' : '') + '>' + esc(h.kids_note) + '</p>' : ''));
    if ((h.care_types||[]).length || h.hourly_note) {
      html += sec('Care offered',
        '<div class="ct">' + (h.care_types||[]).map(function(ct){ var m = CTM[ct] || {e:'💜', t:ct, h:''};
          return '<div class="ctile ' + esc(ct) + '"><span class="cti">' + m.e + '</span><span class="ctt">' + esc(m.t) + '</span><span class="cth">' + esc(m.h) + '</span></div>'; }).join('') + '</div>' +
        (h.hourly_note ? '<div class="rate">' + esc(h.hourly_note) + '</div>' : '') +
        ((h.payment_methods||[]).length ? '<div class="pay"><span class="paylabel">Accepts</span>' + h.payment_methods.map(MomniLittles.payChip).join('') + '</div>' : ''));
    }
    if (h.home_highlights || h.home_photo) html += sec('Our home',
      (h.home_photo ? '<img class="home-photo" src="' + esc(h.home_photo) + '" alt="' + esc(first) + '’s home" loading="lazy">' : '') +
      (h.home_highlights ? '<p>' + esc(h.home_highlights) + '</p>' : ''));
    if ((h.gallery||[]).length) html += sec('A peek at our life',
      '<div class="gallery">' + h.gallery.map(function(src){ return '<img src="'+esc(src)+'" alt="" loading="lazy">'; }).join('') + '</div>');

    var av = h.availability || {};
    var avRows = DAYS.filter(function(d){ return (av[d]||[]).length; }).map(function(d){
      return '<div class="row"><span class="d">'+d+'</span><span>'+(av[d].map(function(b){ return BLK[b]||b; }).join(', '))+'</span></div>';
    });
    if (avRows.length) html += sec('Available times', '<div class="avail">'+avRows.join('')+'</div>');

    var shared = (h.shared_items||[]).map(function(it){
      var txt = esc(it.label) + (it.as_of ? ' · as of ' + esc(it.as_of) : '');
      return (it.url && /^https:\/\//.test(it.url))
        ? '<p class="shared"><a href="'+esc(it.url)+'" target="_blank" rel="noopener">'+txt+' ↗</a></p>'
        : '<p class="shared">'+txt+'</p>';
    });
    if (h.live_link && /^https?:\/\//.test(h.live_link)) {
      shared.push('<p class="shared"><a href="'+esc(h.live_link)+'" target="_blank" rel="noopener">'+esc(h.live_link_label || 'Their link')+' ↗</a></p>');
    }
    if (shared.length) {
      html += sec('What ' + first + ' shares', shared.join('') +
        '<p class="fine">These are ' + esc(first) + '’s own shared items. Momni doesn’t review or confirm what’s shared, or whether it’s current — you decide how to weigh it.</p>');
    }

    html += sec('Reviews from other Momnis', revs.length ? revs.map(function(r){
      var who = String(r.author || 'A Momni'), av = r.author_photo
        ? '<span class="ravatar" style="background-image:url(\'' + esc(r.author_photo) + '\')"></span>'
        : '<span class="ravatar">' + esc(who.charAt(0).toUpperCase()) + '</span>';
      return '<div class="review"><div class="top">' + av + '<span class="who">'+esc(who)+(r.author_city ? '<small>'+esc(r.author_city)+'</small>' : '')+'</span><span class="rstars">'+stars(r.rating)+'</span></div>' +
        (r.body ? '<div class="body">'+esc(r.body)+'</div>' : '') +
        (r.created_at ? '<div class="date">'+esc(String(r.created_at).slice(0,10))+'</div>' : '') + '</div>';
    }).join('') : '<p style="font-size:14px;color:var(--muted)">No reviews yet. After a visit, both Momnis review each other — that’s how the Circle builds trust.</p>');

    html += '<div class="sec"><p class="fine">Momni is a community platform, not a childcare provider. Momni doesn’t vet, screen, or endorse anyone — you choose and evaluate your own care, just as you would a trusted friend.</p></div>';

    html += '<div class="sec" style="text-align:center;border-top:1px solid var(--line);padding-top:14px">' +
      '<a href="#" id="report-link" style="font-size:13px;color:var(--muted);text-decoration:underline">Report this profile</a>' +
      ' &nbsp;·&nbsp; <a href="#" id="block-link" style="font-size:13px;color:#B0556A;text-decoration:underline">Block ' + esc(first) + '</a>' +
      '<p class="fine" style="margin-top:8px">Every report reaches a real person at Momni.</p></div>';

    document.getElementById('main').innerHTML = html;
    if (h.is_example) {
      document.getElementById('req-btn').setAttribute('href', 'search.html');
      document.getElementById('req-btn').textContent = 'Find real Momnis near you';
      document.querySelector('#cta .note').textContent = 'This is an example profile — Whitney isn’t a real host.';
    } else {
      document.getElementById('req-btn').setAttribute('href', 'booking.html?host_id=' + encodeURIComponent(h.id));
      document.getElementById('req-btn').textContent = 'Request a Link with ' + first;
    }
    document.getElementById('cta').style.display = 'block';

    function needAuth(d){ if (d && d.error && /sign in/i.test(d.error)) { alert('Please sign in to do that, Momni.'); location = 'index.html'; return true; } return false; }
    document.getElementById('report-link').addEventListener('click', function(e){
      e.preventDefault();
      var reason = prompt('What’s the concern? (e.g. inappropriate content, spam, a safety worry)');
      if (reason === null) return;
      fetch('/api/reports', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ subject_type:'host', subject_id: h.id, reason: (reason||'reported').slice(0,80) }) })
        .then(function(r){ return r.status===401 ? {error:'sign in'} : r.json(); })
        .then(function(d){ if (needAuth(d)) return; alert(d.note || d.error || 'Thank you — Karmel reviews every report. 💜'); });
    });
    document.getElementById('block-link').addEventListener('click', function(e){
      e.preventDefault();
      if (!confirm('Block ' + first + '? They will not be able to Link with you or message you, and you will not see each other on Momni.')) return;
      fetch('/api/blocks', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ user_id: h.id }) })
        .then(function(r){ return r.status===401 ? {error:'sign in'} : r.json().then(function(d){ return r.ok ? d : (d.error?{__err:d.error}:d); }); })
        .then(function(d){ if (needAuth(d)) return; if (d && d.__err) { alert(d.__err); return; } alert((d && d.note) || 'Blocked.'); document.getElementById('cta').style.display='none'; });
    });
  }

  function sec(title, inner){ return '<div class="sec"><h2>'+esc(title)+'</h2>'+inner+'</div>'; }
})();
</script>
<script src="site-nav.js" defer></script>
<script src="momni-chat.js" defer></script>
</body>
</html>
